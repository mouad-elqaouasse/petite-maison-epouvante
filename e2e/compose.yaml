# SQ-14 — Toute l'application pour les tests E2E (docs/cadrage.md §1.3.12), avant publication (ADR 0027).
# Préparer d'abord : python3 e2e/preparer.py (certificat, realm de test, définitions RabbitMQ, images dans genere/.env).
# Lancer : docker compose -f e2e/compose.yaml --env-file e2e/genere/.env up -d --wait
#          docker compose -f e2e/compose.yaml --env-file e2e/genere/.env run --rm playwright
# Le navigateur voit les adresses de la prod (D2) : la passerelle porte les deux noms d'hôte sur le réseau de la pile,
# avec un certificat auto-signé ; l'image du front est donc l'image publiée, CSP et URL de Keycloak comprises.
name: epouvante-e2e

x-service-java: &service-java
  restart: "no"
  depends_on:
    postgresql: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    keycloak: { condition: service_healthy }
  environment: &env-commun
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.epouvante.menuly-app.com/realms/epouvante
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/epouvante/protocol/openid-connect/certs

services:
  postgresql:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: postgres-e2e
      MDP_TROC: ${MDP_TROC}
      MDP_NOTIFICATION: ${MDP_NOTIFICATION}
    volumes:
      - ./postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification"]
      interval: 2s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    volumes:
      - ./genere/definitions.json:/etc/rabbitmq/definitions/definitions.json:ro
      - ./rabbitmq/20-e2e.conf:/etc/rabbitmq/conf.d/20-e2e.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      retries: 30

  # Realm de test (D3) ; issuer public fixe derrière la passerelle, comme sur le cluster (ADR 0003).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: https://auth.epouvante.menuly-app.com
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./genere/realm-epouvante.json:/opt/keycloak/data/import/realm-epouvante.json:ro
    healthcheck:
      # Image sans curl : requête HTTP écrite à la main sur le port de gestion.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      retries: 60

  troc-service:
    <<: *service-java
    image: ${IMAGE_TROC}
    environment:
      <<: *env-commun
      # Faux stockage des photos (cadrage §1.3.12) ; URL sur res.cloudinary.com, servies par une route Playwright (D4).
      SPRING_PROFILES_ACTIVE: photo-factice
      APP_PHOTO_FACTICE_URL_BASE: https://res.cloudinary.com/e2e/image/upload/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/troc
      SPRING_DATASOURCE_USERNAME: troc
      SPRING_DATASOURCE_PASSWORD: ${MDP_TROC}
      SPRING_RABBITMQ_USERNAME: troc
      SPRING_RABBITMQ_PASSWORD: ${MDP_TROC}

  notification-service:
    <<: *service-java
    image: ${IMAGE_NOTIFICATION}
    environment:
      <<: *env-commun
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/notification
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: ${MDP_NOTIFICATION}
      SPRING_RABBITMQ_USERNAME: notification
      SPRING_RABBITMQ_PASSWORD: ${MDP_NOTIFICATION}

  front:
    image: ${IMAGE_FRONT}

  # Routage par préfixe comme les Ingress du cluster (ADR 0006), TLS avec le certificat de test.
  passerelle:
    image: traefik:v3.3.4
    command:
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/dynamique.yaml
      - --log.level=WARN
    volumes:
      - ./traefik/dynamique.yaml:/etc/traefik/dynamique.yaml:ro
      - ./genere/certificat.pem:/certs/certificat.pem:ro
      - ./genere/cle.pem:/certs/cle.pem:ro
    depends_on: [front, troc-service, notification-service, keycloak]
    networks:
      default:
        aliases: [epouvante.menuly-app.com, auth.epouvante.menuly-app.com]

  # Lancé à la demande (docker compose run) ; même version de Playwright que e2e/tests/package.json.
  playwright:
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    profiles: [tests]
    working_dir: /tests
    command: ["bash", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
    environment:
      CI: ${CI:-}
    volumes:
      - ./tests:/tests
    depends_on: [passerelle]
