# E2E seul (SQ-14, ADR 0027) : quand seuls les parcours, la pile Compose ou _e2e.yml changent, les trois composants
# sont testés à leur tag déployé. Aucune image construite, rien de publié ni de livré.
name: e2e

on:
  push:
    branches: [main]
    paths:
      - e2e/**
      - .github/workflows/e2e.yml
      - .github/workflows/_e2e.yml
  pull_request:
    paths:
      - e2e/**
      - .github/workflows/e2e.yml
      - .github/workflows/_e2e.yml

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    uses: ./.github/workflows/_e2e.yml
