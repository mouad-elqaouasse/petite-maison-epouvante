# Expérience 3 — chaîne de livraison de l'application de test :
# build + test → image → scan Trivy → push GHCR (tag = SHA) → tag écrit dans deploy/ → Flux déploie → vérification HTTPS.
#
# Pas de boucle, deux protections indépendantes :
#   1. le commit du bot est poussé avec GITHUB_TOKEN : GitHub ne déclenche aucun workflow pour ces push ;
#   2. le filtre de chemins ne contient pas experimentations/exp3/deploy/**, le seul dossier modifié par le bot.
name: exp3-hello

on:
  push:
    branches: [main]
    paths:
      - experimentations/exp3/hello/**
      - .github/workflows/exp3-hello.yml
  workflow_dispatch:

# Permissions minimales : écrire le tag dans le dépôt, pousser l'image sur GHCR. Toutes les autres sont à none.
permissions:
  contents: write
  packages: write

# Une livraison à la fois : deux commits de tag ne peuvent pas se croiser.
concurrency:
  group: exp3-hello
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mouad-elqaouasse/petite-maison-epouvante/exp3-hello
  URL_PUBLIQUE: https://epouvante.menuly-app.com

jobs:
  livrer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build et tests
        working-directory: experimentations/exp3/hello
        run: ./mvnw -B verify

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # L'image est construite une seule fois, chargée localement, scannée, puis c'est elle qui est poussée.
      - name: Construction de l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: experimentations/exp3/hello
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          load: true
          push: false

      - name: Scan Trivy (bloquant si critique ou haute)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push sur GHCR
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          echo "Image poussée : \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      # Commit du bot : seul newTag change. GITHUB_TOKEN → ce push ne relance aucun workflow.
      - name: Écriture du tag dans deploy/
        run: |
          fichier=experimentations/exp3/deploy/kustomization.yaml
          sed -i -E "s|^(\s*newTag:).*|\1 \"$GITHUB_SHA\"|" "$fichier"
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: déploie exp3-hello ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Tag écrit dans $fichier : $(date -u +%H:%M:%S) UTC" >> "$GITHUB_STEP_SUMMARY"

      # Vérification après déploiement (docs/cadrage.md §1.3.12) : boucle bornée, aucun test fonctionnel sur l'URL publique.
      - name: Vérification HTTPS du SHA en ligne
        run: |
          debut=$(date +%s)
          for _ in $(seq 60); do
            if curl -fsS --max-time 5 "$URL_PUBLIQUE/version" | grep -q "\"sha\":\"$GITHUB_SHA\""; then
              echo "SHA $GITHUB_SHA en ligne après $(( $(date +%s) - debut )) s" | tee -a "$GITHUB_STEP_SUMMARY"
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://${URL_PUBLIQUE#https://}/version")
              echo "HTTP en clair → $code (redirection attendue : 301 ou 308)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "SHA $GITHUB_SHA absent de $URL_PUBLIQUE/version après 10 min" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
