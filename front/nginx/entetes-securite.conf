# En-têtes de sécurité du front (docs/cadrage.md §1.4.14). HSTS et la redirection HTTPS sont portés par Traefik.
# Toutes les sources limitées à 'self' : même origine pour le front et les API (ADR 0006), polices auto-hébergées.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
