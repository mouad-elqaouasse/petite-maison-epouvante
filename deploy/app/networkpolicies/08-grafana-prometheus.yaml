# SQ-08 — Grafana → Prometheus 9090 (source de données). Aucune sortie vers Internet pour Grafana.
# Le tunnel kubectl port-forward vers Grafana et Prometheus passe par le kubelet, pas par le réseau des pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-prometheus-sortie
  namespace: app
  labels:
    regle: grafana-prometheus
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-prometheus-entree
  namespace: app
  labels:
    regle: grafana-prometheus
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
