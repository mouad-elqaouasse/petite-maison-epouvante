# nginx du front (SQ-03) : fichiers statiques d'Angular, en-têtes de sécurité, repli sur index.html.
# Système de fichiers en lecture seule (docs/cadrage.md §1.4.14) : seul /tmp est inscriptible (emptyDir).
# Un seul worker : limite de 32 Mio (docs/cadrage.md §1.4.18).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Logs JSON sur stdout, comme les services (docs/cadrage.md §1.4.16).
    log_format json escape=json '{"time":"$time_iso8601","status":$status,"method":"$request_method",'
                                '"uri":"$uri","bytes":$body_bytes_sent,"duration":$request_time,'
                                '"userAgent":"$http_user_agent"}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # add_header n'est pas hérité par un location qui en déclare : chaque location inclut les en-têtes.
        include /etc/nginx/entetes-securite.conf;

        # Fichiers nommés avec leur empreinte par le build : cache long.
        location ~* \.(?:js|css|woff2?|ico)$ {
            include /etc/nginx/entetes-securite.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Doivent refléter le dernier déploiement.
        location = /version.json {
            include /etc/nginx/entetes-securite.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Routes Angular : tout chemin inconnu renvoie index.html.
        location / {
            include /etc/nginx/entetes-securite.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
