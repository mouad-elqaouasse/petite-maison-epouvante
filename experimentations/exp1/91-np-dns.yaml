# Expérience 1, partie 5 — NetworkPolicies, étape 2 : résolution de noms pour tous les pods de sandbox.
# Destination : pods CoreDNS de kube-system (la règle s'applique après la traduction de l'adresse du service kube-dns).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sortie-dns
  namespace: sandbox
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
