# Middlewares Traefik communs aux Ingress de app (docs/cadrage.md §1.4.14, décision du 29/10/2026).
# Cités par chaque Ingress (annotation router.middlewares), pas sur le point d'entrée : l'Ingress temporaire du solveur
# HTTP-01 de cert-manager n'en porte aucun, la validation Let's Encrypt reste en HTTP (ADR 0001, Conséquences).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# HSTS d'un an, limité à ce sous-domaine : ni includeSubDomains ni preload (choix réversible, comme à l'exp. 3).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: entetes-securite
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: false
    stsPreload: false
    contentTypeNosniff: true
