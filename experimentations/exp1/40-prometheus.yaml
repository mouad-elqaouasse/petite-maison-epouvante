# Expérience 1, partie 2 — Prometheus en manifests simples (pas de kube-prometheus-stack, trop lourd).
# Collecte : Prometheus lui-même, cAdvisor du nœud (RAM/CPU des conteneurs), Keycloak, RabbitMQ.
# La RAM de Prometheus dépend du nombre de séries collectées : ces cibles donnent une mesure réaliste.
# Limite mémoire large : on mesure la consommation réelle avant de fixer les vraies limites.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: sandbox
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sandbox
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      - job_name: keycloak
        static_configs:
          - targets: ["keycloak.sandbox.svc:9000"]
      - job_name: rabbitmq
        static_configs:
          - targets: ["rabbitmq.sandbox.svc:15692"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sandbox
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sandbox
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
