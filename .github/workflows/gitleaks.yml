# Détection de secrets sur tout l'historique, à chaque push et chaque PR, bloquante (docs/cadrage.md §1.3.13).
# Binaire officiel épinglé et vérifié par son checksum, plutôt que l'action gitleaks (licence, tiers de plus).
name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # gitleaks_8.30.1_checksums.txt de la release officielle.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tout l'historique : un secret retiré du code reste dans les commits passés.
          fetch-depth: 0

      - name: Installation de gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks

      - name: Analyse de l'historique
        run: ./gitleaks git --redact --verbose --exit-code 1 .
