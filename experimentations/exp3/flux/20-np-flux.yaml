# Expérience 3 — NetworkPolicies de flux-system : refus total, puis ouvertures une par une
# (même méthode que sandbox, docs/adr/0004-networkpolicies-refus-par-defaut.md).
# Pas de règle vers GHCR : Flux ne lit pas le registre (la CI écrit le tag dans le dépôt) ; le téléchargement des
# images est fait par containerd sur le nœud, hors du champ des NetworkPolicies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: refus-total
  namespace: flux-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sortie-dns
  namespace: flux-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# API Kubernetes : adresse réelle de l'API K3s sur l'hôte, pas celle du service kubernetes.default
# (la règle s'applique après la traduction d'adresse, exp. 1, partie 5, étape B6).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sortie-api-kubernetes
  namespace: flux-system
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 51.178.39.218/32
      ports:
        - protocol: TCP
          port: 6443
---
# source-controller → GitHub (clone HTTPS anonyme). Une NetworkPolicy ne filtre pas par nom de domaine :
# tout le 443 hors du cluster est ouvert (limite notée dans le rapport). Réseaux des pods et des services exclus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: source-controller-sortie-https
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: source-controller
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
      ports:
        - protocol: TCP
          port: 443
---
# kustomize-controller → source-controller : téléchargement de l'archive du dépôt (port http 9090 du pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kustomize-controller-sortie-source
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: kustomize-controller
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: source-controller
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: source-controller-entree-kustomize
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: source-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kustomize-controller
      ports:
        - protocol: TCP
          port: 9090
