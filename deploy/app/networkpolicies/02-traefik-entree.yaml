# SQ-08 — Traefik (kube-system) → pods exposés par un Ingress, ports applicatifs seulement :
# front, troc-service, notification-service et Keycloak sur 8080 (jamais les ports de gestion 8081 et 9000, ADR 0007).
# Solveur HTTP-01 de cert-manager (pod créé dans app pendant une émission ou un renouvellement) sur 8089 (exp. 1, B7).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-entree
  namespace: app
  labels:
    regle: traefik-entree
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["front", "troc-service", "notification-service", "keycloak"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-entree-solveur-acme
  namespace: app
  labels:
    regle: traefik-entree
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8089
