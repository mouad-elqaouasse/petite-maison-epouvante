# ServiceAccount default de app (créé par Kubernetes avec le namespace), géré ici pour un seul réglage :
# aucun jeton monté par défaut. Un pod qui n'a pas besoin de l'API Kubernetes et qui oublie
# automountServiceAccountToken: false ne reçoit donc pas de jeton (SQ-08). Prometheus et kube-state-metrics
# ont leur propre ServiceAccount.
# Si ce fichier est retiré du dépôt, Flux supprime le ServiceAccount et Kubernetes le recrée aussitôt, avec un jeton.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
automountServiceAccountToken: false
