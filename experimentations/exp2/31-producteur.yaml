# Expérience 2 — pod producteur en attente : chaque envoi est lancé par kubectl exec (producteur.py --run ...).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp2-producteur
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exp2-producteur
  template:
    metadata:
      labels:
        app: exp2-producteur
        groupe: exp2
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: producteur
          image: exp2-amqp:2
          imagePullPolicy: Never
          command: ["sleep", "86400"]
          envFrom:
            - secretRef:
                name: exp2-producteur
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
