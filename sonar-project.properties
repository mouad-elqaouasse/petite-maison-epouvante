# Un seul projet SonarCloud pour les trois composants (ADR 0012) : chaque analyse couvre tout le dépôt,
# sinon le code des composants absents serait vu comme supprimé. Analyse lancée par .github/workflows/sonarcloud.yml.
sonar.organization=mouad-elqaouasse
sonar.projectKey=mouad-elqaouasse_petite-maison-epouvante
sonar.projectName=La Petite Maison de l'Épouvante

sonar.sourceEncoding=UTF-8
sonar.sources=troc-service/src/main,notification-service/src/main,front/src
sonar.tests=troc-service/src/test,notification-service/src/test,front/src
sonar.exclusions=front/src/**/*.spec.ts
sonar.test.inclusions=*-service/src/test/**,front/src/**/*.spec.ts

# Services Java : classes compilées et couverture JaCoCo produites par ./mvnw verify.
sonar.java.binaries=troc-service/target/classes,notification-service/target/classes
sonar.java.test.binaries=troc-service/target/test-classes,notification-service/target/test-classes
# Dépendances copiées par dependency:copy-dependencies : sans elles, types non résolus et analyse Java moins précise.
sonar.java.libraries=troc-service/target/dependency/*.jar,notification-service/target/dependency/*.jar
sonar.java.test.libraries=troc-service/target/dependency/*.jar,notification-service/target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=troc-service/target/site/jacoco/jacoco.xml,notification-service/target/site/jacoco/jacoco.xml

# Front : couverture LCOV produite par ng test --coverage (chemins préfixés par front/ dans le workflow).
sonar.javascript.lcov.reportPaths=front/coverage/front/lcov.info

# Configuration de sécurité recopiée à l'identique dans chaque service (SQ-06, décision du 02/11/2026) : duplication
# assumée pour garder deux microservices construits et livrés indépendamment, sans bibliothèque partagée. Toute
# modification de l'un des deux fichiers est reportée dans l'autre. Module commun à reconsidérer si ces classes grossissent.
sonar.cpd.exclusions=**/SecuriteConfig.java

# Classes de démarrage Spring Boot (main seul) : rien à tester unitairement.
sonar.coverage.exclusions=**/*Application.java

# La CI attend le résultat de la Quality Gate et échoue si elle échoue (docs/cadrage.md §1.3.11, indicateur 2).
sonar.qualitygate.wait=true
