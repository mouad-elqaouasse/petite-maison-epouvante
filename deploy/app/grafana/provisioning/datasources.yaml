apiVersion: 1
datasources:
  - name: Prometheus
    # uid fixe : référencé par les tableaux de bord provisionnés.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Intervalle de collecte de Prometheus (prometheus.yml) : $__rate_interval en tient compte.
      timeInterval: 30s
