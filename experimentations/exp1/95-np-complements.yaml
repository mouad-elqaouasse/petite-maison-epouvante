# Expérience 1, partie 5 — NetworkPolicies, étape 6 : ouvertures hors de la liste de départ, nécessaires en app.
#   - Grafana → Prometheus (source de données) ;
#   - Traefik → whoami (epouvante.menuly-app.com) ;
#   - Traefik → solveur HTTP-01 de cert-manager (pods créés pendant une émission ou un renouvellement, port 8089).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-sortie-prometheus
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-entree-grafana
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whoami-entree-traefik
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      app: whoami
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solveur-acme-entree-traefik
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8089
