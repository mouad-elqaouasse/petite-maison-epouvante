# PostgreSQL 18 (image de l'exp. 1), un pod, volume local-path, Service interne seulement (SQ-04).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  labels:
    app: postgresql
data:
  # Exécuté une seule fois, à la création du volume. Un rôle propriétaire par base, CONNECT retiré à PUBLIC :
  # aucun rôle de service n'entre dans la base d'un autre. Mots de passe passés en variables psql, jamais affichés.
  10-bases-et-roles.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      -v troc_mdp="$TROC_DB_PASSWORD" \
      -v notification_mdp="$NOTIFICATION_DB_PASSWORD" \
      -v keycloak_mdp="$KEYCLOAK_DB_PASSWORD" <<-'EOSQL'
      REVOKE ALL ON DATABASE postgres FROM PUBLIC;
      CREATE ROLE troc LOGIN PASSWORD :'troc_mdp';
      CREATE DATABASE troc OWNER troc ENCODING 'UTF8';
      REVOKE ALL ON DATABASE troc FROM PUBLIC;
      CREATE ROLE notification LOGIN PASSWORD :'notification_mdp';
      CREATE DATABASE notification OWNER notification ENCODING 'UTF8';
      REVOKE ALL ON DATABASE notification FROM PUBLIC;
      CREATE ROLE keycloak LOGIN PASSWORD :'keycloak_mdp';
      CREATE DATABASE keycloak OWNER keycloak ENCODING 'UTF8';
      REVOKE ALL ON DATABASE keycloak FROM PUBLIC;
    EOSQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  labels:
    app: postgresql
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels:
    app: postgresql
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Un seul pod à la fois sur le volume (ReadWriteOnce).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      automountServiceAccountToken: false
      # UID/GID 70 : utilisateur postgres de l'image alpine.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: postgres:18.6-alpine
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-admin
                  key: password
            - name: TROC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: troc-db
                  key: password
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: password
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
          # Budget RAM : 64 / 256 Mio (docs/cadrage.md §1.4.18 ; 45 Mio mesurés au repos en exp. 1).
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            # Socket Unix et fichiers temporaires ; le reste du système de fichiers est en lecture seule.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgresql-data
        - name: init
          configMap:
            name: postgresql-init
        - name: run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
# Service interne seulement : aucun Ingress ne le cite.
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels:
    app: postgresql
spec:
  selector:
    app: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
