# troc-service — 1 replica (le HPA 1 → 3 arrive hors de la phase squelette, ADR 0005).
# Ports : 8080 pour l'API (seul port cité par l'Ingress), 8081 pour l'actuator (sondes, métriques ; ADR 0007).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: troc-service
  labels:
    app: troc-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: troc-service
  template:
    metadata:
      labels:
        app: troc-service
      # Collecte par Prometheus, pod par pod (SQ-07) : port de gestion, jamais cité par l'Ingress (ADR 0007).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      automountServiceAccountToken: false
      # Pas de variables d'environnement injectées pour chaque Service de app (SQ-08).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: troc-service
          # Tag remplacé par kustomize (kustomization.yaml, images).
          image: ghcr.io/mouad-elqaouasse/petite-maison-epouvante/troc-service
          ports:
            - name: http
              containerPort: 8080
            - name: gestion
              containerPort: 8081
          # Base troc avec le rôle troc ; mot de passe lu dans le Secret troc-db (SQ-04, ADR 0008).
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresql:5432/troc
            - name: SPRING_DATASOURCE_USERNAME
              value: troc
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: troc-db
                  key: password
            # Broker avec le compte troc (SQ-05, ADR 0010) ; mot de passe lu dans le Secret troc-rabbitmq.
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_USERNAME
              value: troc
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: troc-rabbitmq
                  key: password
            # Jetons Keycloak (SQ-06, ADR 0003) : issuer public ; clés lues par le Service interne, fixées explicitement.
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: https://auth.epouvante.menuly-app.com/realms/epouvante
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://keycloak:8080/realms/epouvante/protocol/openid-connect/certs
          # Budget RAM : 256 / 384 Mio (docs/cadrage.md §1.4.18) ; JVM à 75 % de la limite (Dockerfile).
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Démarrage d'environ 30 s à 500m de CPU (exp. 3), plus environ 40 s de réessais de Flyway si la base
          # est indisponible (ADR 0013) : jusqu'à 120 s tolérées avant redémarrage.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: gestion
            periodSeconds: 3
            failureThreshold: 40
          # readiness inclut les santés db et rabbit (ADR 0013, SQ-05) ; délai de 3 s, au-dessus de celui du pool (2 s).
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: gestion
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: gestion
            periodSeconds: 10
          volumeMounts:
            # Tomcat écrit dans /tmp ; le reste du système de fichiers est en lecture seule.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
# Le port gestion est exposé pour Prometheus (SQ-07) ; l'Ingress ne cite que http.
apiVersion: v1
kind: Service
metadata:
  name: troc-service
  labels:
    app: troc-service
spec:
  selector:
    app: troc-service
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: gestion
      port: 8081
      targetPort: gestion
