spring.application.name=notification-service
# Port de l'API, seul port cité par l'Ingress (ADR 0006).
server.port=8080
# SHA du commit, injecté dans l'image au build (ARG GIT_SHA du Dockerfile).
app.version=${GIT_SHA:inconnu}

# Actuator sur un port de gestion séparé, cité par aucun Ingress (ADR 0007).
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Composants de santé visibles (db…) : port de gestion jamais exposé (ADR 0007).
management.endpoint.health.show-components=always
management.endpoint.health.group.readiness.include=readinessState,db,rabbit

# Base PostgreSQL du service (SQ-04) ; sur le cluster : SPRING_DATASOURCE_URL, _USERNAME et _PASSWORD (Secret notification-db).
spring.datasource.url=jdbc:postgresql://localhost:5432/notification
spring.datasource.username=notification
# Délai court : l'indicateur db répond avant le délai de la sonde readiness (ADR 0013).
spring.datasource.hikari.connection-timeout=2000
# Base indisponible au démarrage : Flyway réessaie (attentes de 1, 2, 4 puis 5 s, environ 40 s au total) au lieu
# d'échouer ; la startupProbe couvre ce délai (ADR 0013).
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=5

# Jetons Keycloak (SQ-06, ADR 0003) ; sur le cluster : issuer = URL publique, clés lues par l'adresse interne,
# fixées explicitement (la découverte renverrait l'URL publique). Clés lues à la première requête, pas au démarrage.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/epouvante
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/epouvante/protocol/openid-connect/certs
# Tolérance sur exp et nbf (valeur par défaut de Spring Security).
app.securite.tolerance-horloge=60s

# RabbitMQ (SQ-05) ; sur le cluster : SPRING_RABBITMQ_HOST, _USERNAME et _PASSWORD (Secret notification-rabbitmq).
# Comptes et topologie chargés par le broker au démarrage (ADR 0010) : le service ne déclare rien.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=notification
# Connexion ouverte à la demande et rouverte après une coupure : le service démarre sans broker, rabbit est DOWN
# dans readiness jusqu'à ce qu'il réponde. Délai court : l'indicateur répond avant le délai de la sonde readiness.
spring.rabbitmq.connection-timeout=2s
