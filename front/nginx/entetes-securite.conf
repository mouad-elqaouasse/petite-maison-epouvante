# En-têtes de sécurité du front (docs/cadrage.md §1.4.14). HSTS et la redirection HTTPS sont portés par Traefik.
# Sources limitées à 'self' : même origine pour le front et les API (ADR 0006), polices auto-hébergées.
# Keycloak (SQ-06) : connect-src pour l'échange du code et le rafraîchissement des jetons, frame-src pour la
# vérification silencieuse de session (check-sso), qui revient ensuite sur silent-check-sso.html ('self').
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://auth.epouvante.menuly-app.com; frame-src 'self' https://auth.epouvante.menuly-app.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
