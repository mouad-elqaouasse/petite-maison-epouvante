# Expérience 1, partie 2 — Keycloak en mode production (start), base dédiée « keycloak » sur PostgreSQL.
# Secrets attendus, créés à la main sur le VPS (jamais dans le dépôt) :
#   postgres-secrets : KEYCLOAK_DB_PASSWORD
#   keycloak-secrets : KC_BOOTSTRAP_ADMIN_PASSWORD
# JVM : Keycloak dimensionne son tas d'après la limite du conteneur (MaxRAMPercentage),
# la limite est donc réaliste dès le départ (768Mi) pour ne pas fausser la mesure.
# Partie 4 : nom d'hôte public fixe (issuer des jetons), TLS terminé par Traefik (HTTP dans le cluster),
# console d'administration jointe seulement par tunnel (kubectl port-forward) sur http://localhost:8180.
# Secret supplémentaire pour les comptes de test (utilisé par 72-configurer-realm.sh, pas par ce pod) :
#   keycloak-test-users : AUTEUR_PASSWORD, ABONNE_PASSWORD
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: sandbox
  labels:
    app: keycloak
spec:
  replicas: 1
  # Pas de mise à jour progressive : deux Keycloak de 768Mi ne tiennent pas dans la RAM du VPS.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          args: ["start"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: KEYCLOAK_DB_PASSWORD
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            # Issuer public : identique dans les jetons quelle que soit l'adresse utilisée (publique ou interne).
            - name: KC_HOSTNAME
              value: https://auth.epouvante.menuly-app.com
            # Console d'administration : uniquement par tunnel depuis le poste (non routée par l'Ingress).
            - name: KC_HOSTNAME_ADMIN
              value: http://localhost:8180
            # TLS terminé par Traefik : HTTP seulement à l'intérieur du cluster.
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            # En-têtes X-Forwarded-* acceptés seulement depuis le réseau des pods (Traefik).
            - name: KC_PROXY_TRUSTED_ADDRESSES
              value: 10.42.0.0/16
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: sandbox
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
