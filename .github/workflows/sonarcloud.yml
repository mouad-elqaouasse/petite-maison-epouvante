# Analyse SonarCloud de tout le dépôt (ADR 0012) : SAST et Quality Gate « Sonar way », bloquante (docs/cadrage.md §1.3.11, §1.3.13).
# Sans filtre de chemin : un seul projet SonarCloud, donc chaque analyse doit contenir les trois composants,
# et le contrôle tourne sur toutes les PR (contrôle obligatoire de main, SQ-11).
# Sur main, l'analyse sert de référence au nouveau code ; elle ne conditionne pas la livraison, bloquée en amont sur la PR.
name: sonarcloud

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Sur une PR, un nouveau push annule l'analyse précédente.
concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : SonarCloud s'en sert pour attribuer les lignes au nouveau code.
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: "*-service/pom.xml"

      # copy-dependencies : jars des dépendances dans target/dependency, lus par l'analyse Java (sonar.java.libraries).
      - name: Tests et couverture, troc-service
        working-directory: troc-service
        run: ./mvnw -B verify dependency:copy-dependencies

      - name: Tests et couverture, notification-service
        working-directory: notification-service
        run: ./mvnw -B verify dependency:copy-dependencies

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Dépendances du front
        working-directory: front
        run: npm ci --no-audit --no-fund

      # Chemins du rapport relatifs à front/ : préfixés pour être résolus depuis la racine du projet SonarCloud.
      - name: Tests et couverture, front
        working-directory: front
        run: |
          npx ng test --watch=false --coverage
          sed -i 's|^SF:|SF:front/|' coverage/front/lcov.info

      # Réglages dans sonar-project.properties ; échec du job si la Quality Gate échoue (sonar.qualitygate.wait).
      - name: Analyse SonarCloud et Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
