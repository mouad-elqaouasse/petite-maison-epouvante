# Tests : une base PostgreSQL éphémère (pilote JDBC de Testcontainers) pour tout contexte Spring qui n'en fournit pas.
# BaseDeDonneesTest la remplace par sa propre base, derrière Toxiproxy.
spring.datasource.url=jdbc:tc:postgresql:18.6-alpine:///troc
# Pas de broker dans les autres tests : indicateur rabbit désactivé et retiré de readiness sans erreur.
# RabbitMqTest le réactive face à son propre RabbitMQ, derrière Toxiproxy.
management.health.rabbit.enabled=false
management.endpoint.health.validate-group-membership=false
# US1a : fausse implémentation de StockagePhoto dans tous les tests de l'application ; aucun appel au vrai
# Cloudinary en CI (docs/cadrage.md §1.3.12). L'adaptateur Cloudinary est testé seul, contre WireMock.
spring.profiles.active=photo-factice
