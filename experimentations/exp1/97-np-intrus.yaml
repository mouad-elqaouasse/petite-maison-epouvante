# Expérience 1, partie 5 — pods « intrus », sans aucune autorisation : un dans sandbox, un dans default.
# Image déjà présente sur le nœud (10-postgres.yaml) : pg_isready pour PostgreSQL, nc et nslookup (busybox) pour le reste.
# Aucun mot de passe : pg_isready teste seulement que le serveur répond.
apiVersion: v1
kind: Pod
metadata:
  name: np-intrus
  namespace: sandbox
  labels:
    app: np-intrus
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: intrus
      image: postgres:18.6-alpine
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
---
apiVersion: v1
kind: Pod
metadata:
  name: np-intrus
  namespace: default
  labels:
    app: np-intrus
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: intrus
      image: postgres:18.6-alpine
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
